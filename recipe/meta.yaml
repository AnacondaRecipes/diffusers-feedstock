{% set name = "diffusers" %}
{% set version = "0.42.1" %}
# Regression tests for GHSA-4prv-5hj7-c2xr, added with the fix in v0.42.1 (offline, harmless payloads).
{% set sec_files = "tests/modular_pipelines/test_modular_pipelines_custom_blocks.py tests/models/test_models_auto.py tests/pipelines/test_pipelines.py" %}
{% set sec_tests = "requirement_name_is_resolved_without_importing or installed_requirement_is_still_resolved or from_pretrained_raises_without_auto_map or library_name_from_model_index_is_not_imported or library_name_matching_pipeline_submodule_is_not_imported" %}

package:
  name: {{ name }}-suite
  version: {{ version }}

# Build and ship from the PyPI sdist (canonical packaging layout). A second source from
# GitHub is merged only to supply upstream tests/ for the feedstock test phase (sdists omit most tests).
source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: ce855ab670c8cd1c7a61be8f12fbc68c081bca8ec5e747273946d8d6c2aff23b
  - url: https://github.com/huggingface/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: f1b2c0ddfb114c544b8a60d2fe2b14937fd9428620d4fe14081991a9ee3ad549
    folder: upstream-github

build:
  number: 0

outputs:
  - name: {{ name }}-base
    # File scripts only (conda-build copies script into work/); same as inline pip install from PyPI root.
    script: build_base.{{ "bat" if win else "sh" }}
    build:
      entry_points:
        - diffusers-cli=diffusers.commands.diffusers_cli:main
      # upstream requires-python >=3.11. py3.15: run dep safetensors >=0.8.0 has
      # no py3.15 build on pkgs/main yet; lift the py>314 cap once it does.
      skip: true  # [py<311 or py>314]
      # torch{{ pytorch }} MUST stay in the build string: otherwise conda-build treats
      # pytorch as unused here, collapses the torch variants into one package, and the
      # exact pins strand the other torch line (broke bn3). py{{ CONDA_PY }} must stay
      # too: a manual string overrides conda-build's default py-prefix.
      string: py{{ CONDA_PY }}_torch{{ pytorch | replace('.', '') }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
    requirements:
      host:
        - pip
        - python
        - setuptools
      run:
        - python
        - importlib-metadata
        - filelock
        - huggingface_hub >=1.32.0,<3.0
        - numpy
        - regex !=2019.12.17
        - requests
        - safetensors >=0.8.0
        - pillow
      # Bounded feature extras from setup.py (torch, training, bitsandbytes, gguf,
      # optimum_quanto, torchao, nvidia_modelopt, sdnq). Unbounded extras are no-ops
      # here; quality/docs/test/dev are dev-only.
      run_constrained:
        - huggingface_accelerate >=0.31.0
        # Deliberately relaxed from upstream's extras-only protobuf<4: the AR pytorch
        # stack needs libprotobuf >=6, so <4 made diffusers unsatisfiable alongside
        # pytorch/unsloth_zoo. A floor is enough here. Supersedes diffusers#6.
        - protobuf >=3.20.3
        - peft >=0.17.0
        - pytorch >=2.6
        - bitsandbytes >=0.43.3
        - gguf >=0.10.0
        - torchao >=0.15.0
        # In no extra upstream, but the AutoRound quantizer asks for this floor (setup.py _deps).
        - auto-round >=0.13.0
        # Not packaged on pkgs/main or conda-forge yet; PyPI names normalized.
        - optimum-quanto >=0.2.6
        # Upstream wants nvidia_modelopt[hf]; conda cannot express the [hf] extra, only the floor.
        - nvidia-modelopt >=0.33.1
        - sdnq >=0.2.2
    test:
      # Upstream tests live only on the GitHub merge (hoisted to upstream-github/tests/). This
      # output is packaged before work/ is torn down, so test/source_files globs succeed here
      # (they fail on later outputs such as diffusers-torch).
      source_files:
        - upstream-github/tests/__init__.py
        - upstream-github/tests/conftest.py
        - upstream-github/tests/testing_utils.py
        - upstream-github/tests/models/__init__.py
        - upstream-github/tests/models/test_activations.py
        - upstream-github/tests/models/test_layers_utils.py
        - upstream-github/tests/models/test_models_auto.py
        - upstream-github/tests/modular_pipelines/__init__.py
        - upstream-github/tests/modular_pipelines/test_modular_pipelines_custom_blocks.py
        - upstream-github/tests/pipelines/__init__.py
        - upstream-github/tests/pipelines/test_pipelines.py
      imports:
        - diffusers
        - diffusers.models
      commands:
        - pip check
        - bash -c 'export DIFFUSERS_TEST_DEVICE=cpu && cd "$SRC_DIR/upstream-github" && python -m pytest tests/models/test_activations.py tests/models/test_layers_utils.py -q --tb=short'  # [unix]
        - set DIFFUSERS_TEST_DEVICE=cpu&& cd /d "%SRC_DIR%\upstream-github"&& python -m pytest tests/models/test_activations.py tests/models/test_layers_utils.py -q --tb=short  # [win]
        - bash -c 'export DIFFUSERS_TEST_DEVICE=cpu HF_HUB_OFFLINE=1 && cd "$SRC_DIR/upstream-github" && python -m pytest {{ sec_files }} -k "{{ sec_tests }}" -q --tb=short'  # [unix]
        - set DIFFUSERS_TEST_DEVICE=cpu&& set HF_HUB_OFFLINE=1&& cd /d "%SRC_DIR%\upstream-github"&& python -m pytest {{ sec_files }} -k "{{ sec_tests }}" -q --tb=short  # [win]
      requires:
        - pip
        - pytest
        - packaging
        - pytorch {{ pytorch }}
        - huggingface_accelerate >=0.31.0
        # imported at module level by the GHSA regression test files
        - transformers >=4.41.2
        - requests-mock
  - name: diffusers-torch
    build:
      skip: true  # [py<311 or py>314]
      string: py{{ CONDA_PY }}_torch{{ pytorch | replace('.', '') }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
    requirements:
      host:
        - pip
        - python
        - setuptools
        # Build against each local-CBC pytorch line so pytorch's run_export version-pins
        # diffusers-torch to that minor, in lockstep with the rest of the torch stack.
        # AR rebuilds against the CBC pytorch each migration (users get tested combos).
        - pytorch {{ pytorch }}
      run:
        - python
        - {{ pin_subpackage(name+'-base', exact=True) }}
        - pytorch >=2.6
        - huggingface_accelerate >=0.31.0
    test:
      imports:
        - diffusers
        - diffusers.models
      commands:
        - pip check
        # the diffusers-cli command requires pytorch at runtime,
        # https://github.com/huggingface/diffusers/blob/v0.42.1/src/diffusers/commands/fp16_safetensors.py#L27
        - diffusers-cli --help
      requires:
        - pip
  - name: diffusers
    build:
      skip: true  # [py<311 or py>314]
      # Without the torch tag this metapackage dedupes across variants and
      # pin_subpackage(exact=True) then locks every consumer to one torch line.
      string: py{{ CONDA_PY }}_torch{{ pytorch | replace('.', '') }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
    requirements:
      host:
        - pip
        - python
        - setuptools
      run:
        - python
        - {{ pin_subpackage(name+'-torch', exact=True) }}
    test:
      imports:
        - diffusers
        - diffusers.models
      commands:
        - pip check
        - diffusers-cli --help
      requires:
        - pip

about:
  home: https://github.com/huggingface/diffusers
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Diffusers provides pretrained vision diffusion models, and serves as a modular toolbox for inference and training.
  description: |
    :hugs: Diffusers provides pretrained diffusion models across multiple modalities,
    such as vision and audio, and serves as a modular toolbox for inference and
    training of diffusion models.

    PyPI: [https://pypi.org/project/diffusers/](https://pypi.org/project/diffusers/)

  doc_url: https://huggingface.co/docs/diffusers/index
  dev_url: https://github.com/huggingface/diffusers

extra:
  recipe-maintainers:
    - sugatoray
    # maintainers from upstream repo
    - anton-l
    - patrickvonplaten
