# Two torch lines; per-key REPLACES the aggregate CBC (still pinned to 2.14).
# diffusers-torch inherits pytorch's run_export, so each line serves only its own
# torch minor; 2.14 keeps the unsloth stack (torch <2.15) covered. Pin the .0
# patch: a 2.14.1 host would export >=2.14.1 and exclude 2.14.0 users.
pytorch:
  - 2.14.0
  - 2.15.0
