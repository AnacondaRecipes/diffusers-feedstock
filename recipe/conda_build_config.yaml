# Build diffusers 0.37.1 against BOTH live pytorch lines so a single diffusers
# version serves consumers on either line:
#   * 2.10.0 -> for the torch-2.10 stack (unsloth / unsloth_zoo cap torch <2.11).
#               The torch-2.10 diffusers build on pkgs/main (bn0) predates the
#               protobuf-loosen fix (diffusers#12) and still carries protobuf<4,
#               which is unsatisfiable with pytorch 2.10's libprotobuf 6.33.5 on
#               py3.13. Rebuilding it here picks up the current run_constrained
#               `protobuf >=3.20.3` (unbounded).
#   * 2.12.0 -> current default line (was the sole target of bn2).
# diffusers-torch host-pins `pytorch {{ pytorch }}` and inherits pytorch's
# run_export, so each variant version-pins diffusers-torch to its own torch
# minor (>=2.10,<2.11 vs >=2.12,<2.13). The variants coexist by variant hash at
# one build number; `conda install diffusers` maximizes the pytorch version and
# so resolves the torch-2.12 variant by default, while a torch<2.11-constrained
# env (unsloth) resolves the torch-2.10 variant. Per-key REPLACES aggregate CBC.
pytorch:
  - 2.10.0
  - 2.12.0
